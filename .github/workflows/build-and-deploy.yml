name: build-and-deploy

# Constrói a imagem do MagnusBilling e publica no GHCR.
# Em seguida dispara o webhook do Portainer, que RE-PUXA a imagem no nó MB
# e atualiza o serviço no Swarm (substitui o Watchtower, que não gerencia
# serviços Swarm — ver DEPLOY.md).

on:
  push:
    branches: [ "source" ]      # ajuste para a sua branch de deploy
    paths-ignore:
      - '**.md'
      - 'ia-docs/**'
      - 'wiki/**'
  workflow_dispatch:

concurrency:
  group: mb-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/magnusbilling:latest
            ghcr.io/${{ github.repository_owner }}/magnusbilling:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy (pull na VPS)
        if: ${{ success() }}
        run: |
          curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" || \
          echo "Webhook falhou — rode 'docker service update --image ghcr.io/${{ github.repository_owner }}/magnusbilling:latest mb_app --with-registry-auth' no nó MB."
